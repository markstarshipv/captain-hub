<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starship V, Before We Leave</title>
<style>
  :root{--navy:#0d2137;--navy2:#12314f;--gold:#f5b301;--red:#d64545;--green:#2e9e62;--ink:#14232f;--mut:#5c6b78;--line:#dde4ea;--bg:#f4f6f8}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:14px 16px 14px;position:sticky;top:0;z-index:30}
  header h1{font-size:19px;margin:0 0 2px} header .sub{font-size:12px;color:#b9cbdd}
  .logout{float:right;color:#b9cbdd;font-size:12px}
  main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .panel h2.ptitle{font-size:16px;margin:0 0 4px}
  .panel .psub{font-size:13px;color:var(--mut);margin:0 0 8px;line-height:1.4}
  .btn{display:inline-block;border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.alt{background:#e8edf1;color:var(--ink)} .btn.warn{background:var(--red);color:#fff} .btn.gold{background:var(--gold);color:var(--ink)} .btn.green{background:var(--green);color:#fff}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .progress{height:10px;background:#e8edf1;border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .progress .fill{height:100%;background:var(--green);border-radius:999px;transition:width .2s}
  .progress-label{font-size:13px;color:var(--mut)}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin:18px 0 6px}
  h2.section:first-child{margin-top:2px}
  .task{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff}
  .task .box{flex:0 0 30px;width:30px;height:30px;border:2px solid #9db2c3;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:#fff;margin-top:1px}
  .task.done .box{background:var(--green);border-color:var(--green)}
  .task .title{font-size:15.5px;font-weight:600;line-height:1.3}
  .task.done .title{color:var(--mut);text-decoration:line-through}
  .task .note{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35}
  .task .by{font-size:12.5px;color:var(--green);margin-top:2px;font-weight:600}
  .task.tappable{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .task .tools{margin-left:auto;flex:0 0 auto;display:flex;gap:2px}
  .toolbtn{border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .owner{display:inline-block;background:#eaf1f7;color:var(--navy);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}
  .badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}
  .badge.overdue{background:#fbe3e3;color:#a52a2a}
  .badge.due_soon{background:#fdf0d3;color:#8a6100}
  .badge.repairs{background:#e8edf1;color:var(--navy)}
  .mrow{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow .mtitle{font-size:15px;font-weight:600;line-height:1.3}
  .mrow .mmeta{font-size:12.5px;color:var(--mut);margin-top:1px}
  .empty{color:var(--mut);padding:10px 2px}
  label.flabel{display:block;font-size:12px;color:var(--mut);margin-top:10px}
  input.finput,select.finput,textarea.finput{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-top:4px;background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{border:1px solid var(--line);background:#eaf1f7;color:var(--navy);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
  dialog{border:1px solid var(--line);border-radius:12px;width:min(94vw,430px);padding:16px}
  dialog label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
  dialog input,dialog select,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  a.golink{color:var(--navy);font-weight:700;font-size:14px}
  .donetoggle{border:0;background:none;color:var(--mut);font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px 2px}
</style>
</head>
<body>
<header>
  <a class="logout" href="/logout">Sign out</a> <a class="logout" href="/" style="margin-right:12px;background:linear-gradient(160deg,#0b2239,#12365a);color:#fff;padding:8px 16px;border:1px solid #c9a227;border-radius:999px;text-decoration:none;font-weight:600;letter-spacing:1.5px;font-size:13px"><span style="color:#c9a227;font-size:14px">&#9875;</span> HOME</a>
  <h1>Before We Leave</h1>
  <div class="sub">What still needs attention before we leave, and who owns it? One screen before a trip.</div>
</header>
<main>
  <section class="panel" id="autoPanel">
    <h2 class="ptitle">From the tracker</h2>
    <p class="psub">Pulled automatically. Nothing to check off here.</p>
    <div id="departureBox"></div>
    <div id="maintenanceBox" style="margin-top:10px"></div>
  </section>
  <section class="panel">
    <h2 class="ptitle">Needs attention</h2>
    <label class="flabel">Who is working<input class="finput" id="personName" placeholder="Your name, for example Mark or Kori"></label>
    <div class="progress-label">Items you check off are stamped with this name and the time.</div>
    <label class="flabel">Add an item<input class="finput" id="newText" placeholder="What needs attention?"></label>
    <label class="flabel">Category<select class="finput" id="newCategory"></select></label>
    <label class="flabel">Owner<input class="finput" id="newOwner" placeholder="Who owns it?" list="ownerNames"></label>
    <datalist id="ownerNames"><option value="Mark"><option value="Kori"></datalist>
    <div class="chips">
      <button class="chip" type="button" data-owner="Mark">Mark</button>
      <button class="chip" type="button" data-owner="Kori">Kori</button>
    </div>
    <div class="btnrow">
      <button class="btn gold" id="addBtn" type="button" style="flex:1">Add item</button>
    </div>
    <div id="itemList"></div>
    <div id="doneBox"></div>
  </section>
</main>
<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h3 style="margin:0">Edit item</h3>
    <input type="hidden" id="i_id">
    <label>Item<textarea id="i_text" rows="2" required></textarea></label>
    <label>Category<select id="i_category"></select></label>
    <label>Owner<input id="i_owner" list="ownerNames"></label>
    <div class="btnrow">
      <button class="btn" type="submit">Save</button>
      <button class="btn alt" type="button" id="itemCancelBtn">Cancel</button>
      <button class="btn warn" type="button" id="itemDeleteBtn">Delete item</button>
    </div>
  </form>
</dialog>
<script src="/before-we-leave/app.js"></script>
</body>
</html>
