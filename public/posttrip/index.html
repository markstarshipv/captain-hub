<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starship V Post-Trip Checklist</title>
<style>
  :root{--navy:#0d2137;--navy2:#12314f;--gold:#f5b301;--red:#d64545;--green:#2e9e62;--ink:#14232f;--mut:#5c6b78;--line:#dde4ea;--bg:#f4f6f8}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:14px 16px 14px;position:sticky;top:0;z-index:30}
  header h1{font-size:19px;margin:0 0 2px} header .sub{font-size:12px;color:#b9cbdd}
  .logout{float:right;color:#b9cbdd;font-size:12px}
  main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .btn{display:inline-block;border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.alt{background:#e8edf1;color:var(--ink)} .btn.warn{background:var(--red);color:#fff} .btn.gold{background:var(--gold);color:var(--ink)} .btn.green{background:var(--green);color:#fff}
  .btn.big{width:100%;padding:16px;font-size:17px}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .progress{height:10px;background:#e8edf1;border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .progress .fill{height:100%;background:var(--green);border-radius:999px;transition:width .2s}
  .progress-label{font-size:13px;color:var(--mut)}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin:18px 0 6px}
  h2.section:first-child{margin-top:2px}
  .task{display:flex;gap:12px;align-items:flex-start;padding:11px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff}
  .task .box{flex:0 0 30px;width:30px;height:30px;border:2px solid #9db2c3;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:#fff;margin-top:1px}
  .task.done .box{background:var(--green);border-color:var(--green)}
  .task .title{font-size:15.5px;font-weight:600;line-height:1.3}
  .task.done .title{color:var(--mut);text-decoration:line-through}
  .task .note{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35}
  .task.tappable{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .task .tools{margin-left:auto;flex:0 0 auto;display:flex;gap:2px}
  .toolbtn{border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .card .meta{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
  .card .desc{font-weight:700;font-size:15px}
  .empty{color:var(--mut);padding:10px 2px}
  label.flabel{display:block;font-size:12px;color:var(--mut);margin-top:10px}
  input.finput,textarea.finput{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-top:4px}
  dialog{border:1px solid var(--line);border-radius:12px;width:min(94vw,430px);padding:16px}
  dialog label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
  dialog input,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .editbar{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
  .editbar .sp{flex:1}
</style>
</head>
<body>
<header>
  <a class="logout" href="/logout">Sign out</a> <a class="logout" href="/" style="margin-right:12px;background:linear-gradient(160deg,#0b2239,#12365a);color:#fff;padding:8px 16px;border:1px solid #c9a227;border-radius:999px;text-decoration:none;font-weight:600;letter-spacing:1.5px;font-size:13px"><span style="color:#c9a227;font-size:14px">&#9875;</span> HOME</a>
  <h1>Starship V Post-Trip Checklist</h1>
  <div class="sub">The close-out list after each trip. Start a closeout, check tasks off as you go, finish with your name.</div>
</header>
<main>
  <section class="panel" id="runPanel"></section>
  <section class="panel">
    <div class="editbar">
      <strong style="font-size:16px">The list</strong>
      <div class="sp"></div>
      <button class="btn alt" id="editToggleBtn" type="button" style="padding:8px 12px;font-size:13px">Edit list</button>
      <button class="btn" id="addTaskBtn" type="button" style="padding:8px 12px;font-size:13px;display:none">Add task</button>
    </div>
    <div id="taskList"></div>
  </section>
  <section class="panel">
    <strong style="font-size:16px">Finished closeouts</strong>
    <div id="historyList" style="margin-top:8px"></div>
  </section>
</main>
<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <h3 id="taskDlgTitle" style="margin:0">Add task</h3>
    <input type="hidden" id="t_id">
    <label>Section<input id="t_section" list="sectionNames" required></label>
    <datalist id="sectionNames"></datalist>
    <label>Task<input id="t_title" required></label>
    <label>Note (optional)<textarea id="t_note" rows="2"></textarea></label>
    <div class="btnrow">
      <button class="btn" type="submit">Save</button>
      <button class="btn alt" type="button" id="taskCancelBtn">Cancel</button>
      <button class="btn warn" type="button" id="taskDeleteBtn">Delete task</button>
    </div>
  </form>
</dialog>
<script src="/posttrip/app.js"></script>
</body>
</html>
