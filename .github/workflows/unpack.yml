name: Unpack upload

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files
        run: |
          set -e
          unzip -o hub-upload.zip -d /tmp/hub
          ls -R /tmp/hub
          TOP_COUNT=$(ls -1 /tmp/hub | wc -l)
          TOP_NAME=$(ls -1 /tmp/hub | head -n 1)
          if [ "$TOP_COUNT" = "1" ] && [ -d "/tmp/hub/$TOP_NAME" ]; then SRC="/tmp/hub/$TOP_NAME"; else SRC="/tmp/hub"; fi
          echo "Unpacking from $SRC"
          cp -a "$SRC"/. .
          rm -f hub-upload.zip
      - name: Commit files
        run: |
          git config user.name "markstarshipv"
          git config user.email "mark@spurling.net"
          git add -A
          git status --short
          git commit -m "Pilot portrait variation"
          git push
